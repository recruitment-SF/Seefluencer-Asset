<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Masuk — Manajemen Aset Seefluencer</title>
<style>
:root{--bg:#f4f7fb;--s1:#ffffff;--b1:#e3eaf2;--b2:#cdd8e6;--t1:#13243a;--t2:#5a6b80;--t3:#90a0b3;--acc:#003c7d;--acc2:#0a4f9c;--red:#c92f2f;--red-bg:#fbe7e7;--r:8px;--r2:12px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r2);width:100%;max-width:380px;padding:30px 28px;box-shadow:0 10px 30px rgba(13,28,51,.06);}
.brand{text-align:center;margin-bottom:22px;}
.brand-name{font-size:18px;font-weight:700;color:var(--acc);letter-spacing:.08em;}
.brand-sub{font-size:11px;color:var(--t3);margin-top:3px;letter-spacing:.04em;}
.title{font-size:15px;font-weight:600;margin-bottom:16px;}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.fg label{font-size:12px;color:var(--t2);font-weight:500;}
.fi{padding:10px 12px;background:var(--bg);border:1px solid var(--b1);border-radius:var(--r);color:var(--t1);font-size:14px;outline:none;font-family:inherit;}
.fi:focus{border-color:var(--acc);}
.btn{width:100%;padding:11px;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--acc);background:var(--acc);color:#fff;font-family:inherit;transition:background .12s;}
.btn:hover{background:var(--acc2);}
.btn:disabled{opacity:.6;cursor:default;}
.err{display:none;background:var(--red-bg);color:var(--red);border:1px solid #f1cccc;border-radius:var(--r);padding:9px 11px;font-size:12px;margin-bottom:14px;}
.err.on{display:block;}
.foot{text-align:center;font-size:11px;color:var(--t3);margin-top:18px;}
</style>
</head>
<body>
<form class="card" id="login-form" autocomplete="on">
  <div class="brand">
    <div class="brand-name">SEEFLUENCER</div>
    <div class="brand-sub">HRGA Asset Management System</div>
  </div>
  <div class="title">Masuk ke akun Anda</div>
  <div class="err" id="err"></div>
  <div class="fg">
    <label for="email">Email</label>
    <input class="fi" type="email" id="email" name="email" required autocomplete="username" autofocus>
  </div>
  <div class="fg">
    <label for="password">Password</label>
    <input class="fi" type="password" id="password" name="password" required autocomplete="current-password">
  </div>
  <button class="btn" type="submit" id="submit">Masuk</button>
  <div class="foot">PT. Seefluencer Digital Kreatif</div>
</form>
<script>
var form = document.getElementById('login-form');
var errBox = document.getElementById('err');
var btn = document.getElementById('submit');
function showErr(msg) { errBox.textContent = msg; errBox.classList.add('on'); }
form.addEventListener('submit', function (e) {
  e.preventDefault();
  errBox.classList.remove('on');
  btn.disabled = true;
  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value
    })
  })
    .then(function (r) {
      if (r.ok) { location.href = '/'; return null; }
      return r.json().catch(function () { return {}; });
    })
    .then(function (d) {
      if (d) { showErr((d && d.error) || 'Email atau password salah.'); btn.disabled = false; }
    })
    .catch(function () { showErr('Gagal terhubung ke server.'); btn.disabled = false; });
});
</script>
</body>
</html>
